<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141c19" />
      <stop offset="100%" stop-color="#070908" />
    </radialGradient>

    <!-- Emerald-Teal Primary Glow -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Subtle Node Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="shield-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Base Badge with Concentric Curvature -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#10b981" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Outer Concentric Orbit (Circadian Cycle Ring) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#shield-stroke)" stroke-width="3" stroke-dasharray="16 12" opacity="0.6"/>

  <!-- Circadian Equilibrium Wave & Biosignal Pulse -->
  <path d="M 120 256 C 160 256, 180 256, 204 256 C 220 256, 230 148, 246 148 C 258 148, 268 364, 282 364 C 294 364, 304 232, 318 232 C 328 232, 336 256, 350 256 C 368 256, 388 256, 392 256" 
        fill="none" 
        stroke="url(#brand-grad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Homeostatic Core Crescent Node -->
  <circle cx="246" cy="148" r="8" fill="#ecfdf5" filter="url(#glow)"/>
  <circle cx="282" cy="364" r="8" fill="#10b981" filter="url(#glow)"/>
  <circle cx="318" cy="232" r="7" fill="#34d399"/>

  <!-- Satellite Telemetry Node -->
  <circle cx="375" cy="137" r="12" fill="#10b981" fill-opacity="0.8"/>
  <circle cx="375" cy="137" r="22" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.5"/>
</svg>
