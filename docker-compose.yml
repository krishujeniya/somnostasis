services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: somnostasis_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./somnostasis.db
    volumes:
      - somnostasis_models:/app/models
      - somnostasis_data:/app/data
      - somnostasis_reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - somnostasis-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: somnostasis_dashboard
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - somnostasis_models:/app/models
      - somnostasis_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - somnostasis-net

volumes:
  somnostasis_models:
  somnostasis_data:
  somnostasis_reports:

networks:
  somnostasis-net:
    driver: bridge
